<section id="offre" class="bj-scene" aria-labelledby="offre-title">
  <div class="bj-wrap">
    <header class="bj-head">
      <span class="bj-tape bj-tape--white" style="--r:-2deg">ce que je propose</span>
      <h2 id="offre-title" class="bj-head__title bj-extrude" data-tone="tally">Je fais quoi pour toi&nbsp;?</h2>
      <p class="bj-head__lead">Choisis ce qu'il te faut, on en parle juste après.</p>
    </header>
    <div class="of-row" role="group" aria-label="Services, plusieurs choix possibles">
      <button class="of-box" type="button" aria-pressed="false" data-s="Site web" style="--c: var(--mustard)">
        <span class="of-ico of-ico--web" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="of-name">Site web</span>
        <span class="of-line">resto, coach, vitrine</span>
        <span class="of-check" aria-hidden="true"></span>
      </button>
      <button class="of-box" type="button" aria-pressed="false" data-s="Miniatures" style="--c: var(--canister)">
        <span class="of-ico of-ico--thumb" aria-hidden="true"><b>WOW</b></span>
        <span class="of-name">Miniatures</span>
        <span class="of-line">YouTube, qui font cliquer</span>
        <span class="of-check" aria-hidden="true"></span>
      </button>
      <button class="of-box" type="button" aria-pressed="false" data-s="Montage" style="--c: var(--mint)">
        <span class="of-ico of-ico--edit" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="of-name">Montage</span>
        <span class="of-line">vidéos rythmées</span>
        <span class="of-check" aria-hidden="true"></span>
      </button>
    </div>
    <p class="of-basket" aria-live="polite"><span class="of-basket__txt">Rien de choisi pour l'instant.</span> <a class="bj-tape bj-tape--canister of-basket__go" href="#contact" hidden>on en parle&nbsp;→</a></p>
  </div>
</section>
