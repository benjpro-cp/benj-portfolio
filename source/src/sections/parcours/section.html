<section id="parcours" class="bj-scene" aria-labelledby="parcours-title">
  <div class="bj-wrap">
    <header class="bj-head">
      <span class="bj-tape bj-tape--white" style="--r:2deg">mon parcours</span>
      <h2 id="parcours-title" class="bj-head__title bj-extrude" data-tone="canister">Marche par marche.</h2>
    </header>

    <ol class="pa-stairs" aria-label="Parcours, du plus ancien à aujourd'hui">
      <li class="pa-step" style="--i:0">
        <button class="pa-step__btn" type="button" data-step="0">
          <span class="pa-step__when bj-osd-font">avant</span>
          <span class="pa-step__what">Lycée privé Viala&nbsp;Lacoste</span>
        </button>
      </li>
      <li class="pa-step" style="--i:1">
        <button class="pa-step__btn" type="button" data-step="1">
          <span class="pa-step__when bj-osd-font">1<sup>re</sup> année</span>
          <span class="pa-step__what">EFAP Aix-en-Provence</span>
        </button>
      </li>
      <li class="pa-step pa-step--job" style="--i:2">
        <button class="pa-step__btn" type="button" data-step="2">
          <span class="pa-step__when bj-osd-font">stage · 2 mois</span>
          <span class="pa-step__what">Radio Star</span>
        </button>
      </li>
      <li class="pa-step is-here" style="--i:3" aria-current="step">
        <button class="pa-step__btn" type="button" data-step="3">
          <span class="pa-step__when bj-osd-font">2<sup>e</sup> année · maintenant</span>
          <span class="pa-step__what">EFAP Aix-en-Provence</span>
          <span class="pa-step__extra">Vice-président du BDE</span>
        </button>
      </li>
      <li class="pa-step pa-step--next" style="--i:4">
        <button class="pa-step__btn" type="button" data-step="4">
          <span class="pa-step__when bj-osd-font">la suite</span>
          <span class="pa-step__what">à construire</span>
        </button>
      </li>
    </ol>
    <div class="pa-benj" aria-hidden="true">
      <img src="assets/pose-jump.webp" width="440" height="469" alt="" loading="lazy" decoding="async" draggable="false">
      <span class="bj-shadow pa-benj__sh"></span>
    </div>
    <p class="bj-hint pa-hint" aria-hidden="true" style="--r:-4deg"><span>fais-le sauter&nbsp;!</span></p>
  </div>
</section>
